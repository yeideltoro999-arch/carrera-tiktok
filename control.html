<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control de Carrera TikTok</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101820;color:#fff;font-family:Arial,sans-serif;padding:18px}h1{text-align:center;margin:0 0 8px}.status{text-align:center;padding:10px;border-radius:10px;background:#263b4d;margin-bottom:14px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:700px;margin:auto}button{border:0;border-radius:12px;padding:15px 10px;color:#fff;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #333}button:active{transform:translateY(3px);box-shadow:0 1px 0 #333}.start{background:#18a957}.stop{background:#e04f3e}.reset{background:#59636d}.gift{background:#168ac0}.full{grid-column:1/-1}.title{max-width:700px;margin:18px auto 8px;font-weight:900;font-size:18px}.small{font-size:13px;text-align:center;opacity:.8;margin-top:15px}</style></head>
<body><h1>🎮 CONTROL DE CARRERA</h1><div class="status" id="status">🟢 Panel conectado</div>
<div class="grid"><button class="start full" onclick="send({type:'start'})">▶ INICIAR CARRERA</button><button class="stop" onclick="send({type:'stop'})">⏸ DETENER</button><button class="reset" onclick="send({type:'reset'})">🔄 REINICIAR</button></div>
<div class="title">🎁 REGALOS — pulsa cuando recibas el regalo</div><div class="grid">
<button class="gift" onclick="gift(0)">🇲🇽 GG → MÉXICO</button><button class="gift" onclick="gift(1)">🇦🇷 🍦 HELADO → ARGENTINA</button><button class="gift" onclick="gift(2)">🇺🇸 🪇 MARACAS → EE. UU.</button><button class="gift" onclick="gift(3)">🇧🇷 🌹 ROSA → BRASIL</button><button class="gift" onclick="gift(4)">🇨🇴 🎵 TIKTOK → COLOMBIA</button><button class="gift" onclick="send({type:'like',amount:25})">❤️ +25 ME GUSTA</button></div>
<div class="title">⚡ TURBOS MANUALES</div><div class="grid"><button class="gift" onclick="send({type:'turbo',index:0})">🇲🇽 TURBO</button><button class="gift" onclick="send({type:'turbo',index:1})">🇦🇷 TURBO</button><button class="gift" onclick="send({type:'turbo',index:2})">🇺🇸 TURBO</button><button class="gift" onclick="send({type:'turbo',index:3})">🇧🇷 TURBO</button><button class="gift" onclick="send({type:'turbo',index:4})">🇨🇴 TURBO</button></div>
<div class="small">Deja abierta esta página mientras haces el LIVE. La carrera sigue en tu fuente de TikTok LIVE Studio.</div>
<script>const channel=new BroadcastChannel("carrera-tiktok-control");function send(data){channel.postMessage(data);document.getElementById("status").textContent="✅ Orden enviada";setTimeout(()=>document.getElementById("status").textContent="🟢 Panel conectado",700)}function gift(i){send({type:"gift",index:i})}</script></body></html>
